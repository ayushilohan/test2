
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WS Command Sender</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }
    #topRow {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 15px;
    }
    #row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 500px;
    }
    input, button {
      padding: 8px;
      font-size: 14px;
    }
    #cmdInput {
      flex: 1;
    }
    #logs {
      width: 100%;
      height: 300px;
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div id="topRow">
    <input id="wsUrl" value="ws://107.109.203.45:8080" style="flex:1;">
    <button id="connectBtn">Connect</button>
  </div>

  <div id="row">
    <input id="cmdInput" style="height: 60px;" placeholder="Enter command...">
    <button id="runBtn" style="height: 40px;">Run</button>
  </div>

  <div id="logs"></div>

  <script>
    var ws = null;
    var logs = document.getElementById("logs");

    function append(msg) {
      logs.innerText += msg + "\n";
      logs.scrollTop = logs.scrollHeight;
    }

    document.getElementById("connectBtn").onclick = function () {
      var url = document.getElementById("wsUrl").value;
      ws = new WebSocket(url);

      ws.onopen = function () { append("Connected"); };
      ws.onmessage = function (e) { append("TV → " + e.data); };
      ws.onerror = function () { append("Error"); };
      ws.onclose = function () { append("Disconnected"); };
    };

    document.getElementById("runBtn").onclick = function () {
      if (!ws || ws.readyState !== 1) {
        append("Not connected");
        return;
      }

      var txt = document.getElementById("cmdInput").value;
      if (txt.trim() === "") return;

      ws.send(JSON.stringify({ cmd: txt }));
      append("You → " + txt);
      document.getElementById("cmdInput").value = "";
    };
  </script>
</body>
</html>
